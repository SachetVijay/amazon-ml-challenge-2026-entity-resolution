[project]
name = "business-entity-resolution"
version = "0.1.0"
requires-python = ">=3.10"
description = "Amazon ML Challenge 2026: Business Entity Resolution (Team AMS)"
dependencies = [
  "numpy", "pandas", "pyarrow", "scipy", "scikit-learn", "lightgbm",
  "rapidfuzz", "anyascii", "sparse-dot-topn",
]

[project.optional-dependencies]
gpu = [
  "torch", "transformers>=4.51", "sentence-transformers>=3.0",
  "datasets", "accelerate",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/er"]
